name: Dependency compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ThirdParty/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.github/workflows/dependencies.yml'
  push:
    branches: [master]
    paths:
      - 'ThirdParty/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - '.github/workflows/dependencies.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Named explicitly so that cmake_args is not part of the name
    name: build (${{ matrix.os }}, ${{ matrix.cxx }}, ${{ matrix.cc }}, ${{ matrix.type }}, ${{ matrix.cmake }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
            cc: gcc
            type: Release
            cmake: '3.20.5'
          # With SCIP from its Ubuntu package, whose library contains and exports Ipopt 3.14, which would clash with
          # Ubuntu's Ipopt 3.11 in the same process, so this job is built without Ipopt
          - os: ubuntu-24.04
            cxx: clang++
            cc: clang
            type: Debug
            cmake: '4.1.2'
            cmake_args: -DHAS_SCIP=ON -DSCIP_DIR=/usr -DHAS_IPOPT=OFF
          # With SCIP from Homebrew
          - os: macos-15
            cxx: clang++
            cc: clang
            type: Release
            cmake: '4.1.2'
            cmake_args: -DHAS_SCIP=ON -DSCIP_DIR=$(brew --prefix scip)
          # Native MSVC build with the Cbc and Ipopt packages of the Windows
          # wheels, and SCIP's Windows package. SHOTpy is tested on Windows by the
          # wheel workflow.
          - os: windows-2022
            cxx: cl
            cc: cl
            type: Release
            cmake: '4.1.2'
            cmake_args: -DHAS_PYTHON=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DHAS_SCIP=ON
    runs-on: ${{ matrix.os }}
    # SCIP's packages for Ubuntu 24.04 and Windows from its GitHub release, which do not include readline
    env:
      SCIP_VERSION: '10.1.0'
      SCIP_LINUX_SHA256: bdcc5c83587c84959f12fd58b40ca116c97626032fa3e2a0eaa2225f9b7abb2a
      SCIP_WINDOWS_SHA256: E71BAFB8CE3C26386AE0D93CDD51867F21EB74B70986BBD696B7B864A3C355FF
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = [Environment]::GetEnvironmentVariables('Process')
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) {
            throw 'No Visual Studio installation with the x64 C++ tools was found.'
          }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-Command cl.exe -ErrorAction Stop
          # Keep the developer environment for the following steps. Python and the pinned
          # CMake are added after this, so that they come before the CMake of Visual Studio.
          Get-ChildItem Env: | Where-Object {
            $_.Name -ne 'PATH' -and $before[$_.Name] -cne $_.Value
          } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
          $originalPath = $before['PATH'] -split ';'
          $env:PATH -split ';' | Where-Object {
            $_ -and $_ -notin $originalPath
          } | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
      # CMakeLists.txt uses ccache when it is installed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install 'cmake==${{ matrix.cmake }}' ninja pytest numpy matplotlib ipython pandas pybind11-stubgen
      # The apt mirror is sometimes very slow, so keep the downloaded packages between runs.
      - name: Restore apt packages
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-dependencies-
          restore-keys: apt-${{ matrix.os }}-dependencies-
      - name: Install Linux solvers
        if: runner.os == 'Linux'
        id: apt
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            coinor-libcbc-dev coinor-libipopt-dev pkg-config ccache
          sudo chown -R "$USER" ~/apt-archives
          echo "key=apt-${{ matrix.os }}-dependencies-$(ls ~/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save apt packages
        if: runner.os == 'Linux'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
      - name: Install macOS solvers
        if: runner.os == 'macOS'
        run: brew install cbc ipopt pkg-config ccache scip
      - name: Install Windows solvers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = "$env:RUNNER_TEMP/shot-deps" -replace '\\', '/'
          ./scripts/prepare-wheel-dependencies.ps1 -Destination $deps
          $solvers = (Get-Content -LiteralPath ThirdParty/versions.json -Raw | ConvertFrom-Json).external_solvers
          $cbc = "$deps/Cbc/$($solvers.Cbc.windows.directory)"
          $ipopt = "$deps/Ipopt/$($solvers.Ipopt.windows.directory)"
          # SCIP's Windows package. Its Ipopt DLL has the same name and version as the one SHOT uses, which Windows
          # loads from the directory of the program, before the directories in PATH.
          $scipArchive = "$deps/scipoptsuite-$env:SCIP_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/scipopt/scip/releases/download/v$env:SCIP_VERSION/scipoptsuite-$env:SCIP_VERSION-win-x64.zip" -OutFile $scipArchive
          if ((Get-FileHash -LiteralPath $scipArchive -Algorithm SHA256).Hash -ne $env:SCIP_WINDOWS_SHA256) {
            throw "Checksum mismatch for $scipArchive"
          }
          Expand-Archive -LiteralPath $scipArchive -DestinationPath "$deps/SCIP" -Force
          $scip = "$deps/SCIP/scipoptsuite-$env:SCIP_VERSION-win-x64"
          "$scip/bin" -replace '/', '\' | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
          "SOLVER_ARGS=-DCBC_DIR=$cbc -DIPOPT_DIR=$ipopt -DSCIP_DIR=$scip" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Install SCIP on Linux
        if: runner.os == 'Linux' && contains(matrix.cmake_args, 'HAS_SCIP=ON')
        run: |
          deb="scipoptsuite_${SCIP_VERSION}-1+noble_amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://github.com/scipopt/scip/releases/download/v${SCIP_VERSION}/$deb"
          echo "$SCIP_LINUX_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/$deb"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.type }}
          max-size: 500M
          evict-old-files: job
      - name: Verify dependency pins
        run: python scripts/check-dependencies.py
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja -Werror=dev -Werror=deprecated
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DSHOT_WARNINGS_AS_ERRORS=ON
          -DHAS_GAMS=OFF -DHAS_CPLEX=OFF -DHAS_GUROBI=OFF
          -DHAS_PYTHON=ON -DCOMPILE_TESTS=ON
          ${{ matrix.cmake_args }} $SOLVER_ARGS
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --parallel "$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)" --output-on-failure --timeout 300 -E 'FullInstance'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tests-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            build/CMakeCache.txt
            build/Testing/Temporary/
