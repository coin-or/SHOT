name: Documentation
on:
  pull_request:
    paths: ['docs/**', 'src/**', 'CMakeLists.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  push:
    branches: [master]
    paths: ['docs/**', 'src/**', 'CMakeLists.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The apt mirror is sometimes very slow, so keep the downloaded packages between runs.
      - name: Restore apt packages
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-docs-
          restore-keys: apt-ubuntu-24.04-docs-
      - name: Install build dependencies
        id: apt
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            doxygen coinor-libipopt-dev libopenblas-dev ninja-build ccache
          sudo chown -R "$USER" ~/apt-archives
          echo "key=apt-ubuntu-24.04-docs-$(ls ~/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save apt packages
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
      # CMakeLists.txt uses ccache when it is installed; the pip build uses the fixed build/{wheel_tag} directory.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: docs
          max-size: 500M
          evict-old-files: job
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Compile and install matching SHOTpy
        timeout-minutes: 45
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        # Verbose pip streams native build progress instead of buffering it until completion.
        run: python -m pip install --verbose . --config-settings=cmake.define.HAS_CBC=off
      - name: Check guide settings and Python examples
        run: python docs/check_examples.py
      - name: Build documentation
        run: python docs/build.py --source-ref "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: shot-docs-dev
          path: build/docs/html
