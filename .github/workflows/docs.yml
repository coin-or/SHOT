name: Documentation
on:
  pull_request:
    paths: ['docs/**', 'src/**', 'CMakeLists.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  push:
    branches: [master]
    paths: ['docs/**', 'src/**', 'CMakeLists.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen coinor-libipopt-dev libopenblas-dev ninja-build
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Compile and install matching SHOTpy
        timeout-minutes: 45
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        # Verbose pip streams native build progress instead of buffering it until completion.
        run: python -m pip install --verbose . --config-settings=cmake.define.HAS_CBC=off
      - name: Build documentation
        run: python docs/build.py --source-ref "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: shot-docs-dev
          path: build/docs/html
